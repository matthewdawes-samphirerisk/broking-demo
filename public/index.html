<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broking dashboard</title>
<script>
  // Runs before the page paints, so a dark-mode user never sees a white flash.
  try {
    const saved = localStorage.getItem('theme');
    document.documentElement.dataset.theme =
      saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
  /* Every colour is a token, so the theme switch is one attribute on <html>
     and nothing has to be re-rendered — the SVG chart included. */
  :root {
    color-scheme: light;
    --bg: #f4f6f9;      --card: #fff;        --border: #e4e8ee;   --track: #eef1f5;
    --text: #101828;    --muted: #667085;    --num: #344054;      --dim-text: #98a2b3;
    --bar: #2f5fd0;     --bar-on: #1b3c91;   --bar-off: #cfdaf2;
    --hl: #d0454f;      --hl-on: #971d26;    --hl-off: #f2c9cc;
    --grid: #eaeef3;    --axis: #d6dce4;     --hover: #f5f7fa;    --col-hover: #eef2f8;
    --accent: #1b3c91;  --chip-bg: #e8effc;  --chip-bd: #c6d8f7;  --chip-hover: #d8e5fb;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c0f16;      --card: #141924;     --border: #232a38;   --track: #1c2230;
    --text: #e8ebf1;    --muted: #94a0b4;    --num: #cbd3e0;      --dim-text: #6b7688;
    --bar: #5b8def;     --bar-on: #9dbcff;   --bar-off: #29334a;
    --hl: #ef5f69;      --hl-on: #ff9ba1;    --hl-off: #4a2a30;
    --grid: #1f2632;    --axis: #333c4d;     --hover: #1a202c;    --col-hover: #1a2130;
    --accent: #9dbcff;  --chip-bg: #17233b;  --chip-bd: #2a3d64;  --chip-hover: #1f2f4e;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  body { font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
         margin: 0; padding: 0 28px 56px; background: var(--bg); color: var(--text);
         -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1160px; margin: 0 auto; }

  /* header */
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
           padding: 30px 0 20px; }
  h1 { font-size: 21px; font-weight: 650; letter-spacing: -.015em; margin: 0 0 3px; }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0; }
  #theme { font: inherit; font-size: 13px; background: var(--card); color: var(--text);
           border: 1px solid var(--border); border-radius: 8px; padding: 7px 13px; cursor: pointer;
           white-space: nowrap; flex-shrink: 0; box-shadow: var(--shadow); transition: background .15s; }
  #theme:hover { background: var(--hover); }

  /* filter bar — sticks to the top so the active filters stay visible */
  #filters { position: sticky; top: 0; z-index: 5;
             display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
             background: var(--card); border: 1px solid var(--border); border-radius: 10px;
             padding: 11px 14px; margin-bottom: 18px; box-shadow: var(--shadow); }
  #filters .lead { color: var(--muted); font-size: 13.5px; }
  .chip { font: inherit; font-size: 13px; background: var(--chip-bg); color: var(--accent);
          border: 1px solid var(--chip-bd); border-radius: 999px; padding: 4px 11px; cursor: pointer;
          transition: background .15s; }
  .chip:hover { background: var(--chip-hover); }
  .chip .x { margin-left: 7px; opacity: .55; font-weight: 600; }
  .chip .dim { opacity: .6; }
  #clear-all { font: inherit; font-size: 13px; margin-left: auto; background: none; border: none;
               color: var(--muted); cursor: pointer; padding: 4px 6px; border-radius: 6px;
               text-decoration: underline; text-underline-offset: 2px; }
  #clear-all:hover { color: var(--text); background: var(--hover); }

  /* headline figures */
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
         padding: 20px 22px; box-shadow: var(--shadow); }
  .kpi .label { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
                color: var(--muted); }
  .kpi .value { font-size: 34px; font-weight: 640; letter-spacing: -.02em; line-height: 1.15;
                margin-top: 8px; font-variant-numeric: tabular-nums; }
  .kpi .note { font-size: 12.5px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }

  /* panels */
  section { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
            padding: 20px 22px; margin-bottom: 18px; box-shadow: var(--shadow); }
  h2 { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em;
       color: var(--muted); margin: 0 0 18px; }
  .grid { display: grid; gap: 18px; }
  @media (min-width: 940px) { .grid { grid-template-columns: 1fr 1fr; } .grid section { margin-bottom: 0; } }

  /* breakdown tables */
  table { border-collapse: collapse; width: 100%; }
  tr.row { cursor: pointer; }
  tr.row + tr.row td { border-top: 1px solid var(--track); }
  tr.row:hover td { background: var(--hover); }
  td { padding: 8px 0; vertical-align: middle; }
  td.name { width: 175px; padding-left: 10px; font-size: 14px; }
  td.num { width: 105px; text-align: right; color: var(--num); font-size: 13.5px;
           font-variant-numeric: tabular-nums; padding-right: 10px; }
  tr.on td.name { font-weight: 600; }
  tr.off td.name, tr.off td.num { color: var(--dim-text); }
  .barcell { padding-left: 14px; padding-right: 14px; }
  .track { background: var(--track); border-radius: 999px; height: 9px; width: 100%; }
  .bar { height: 9px; background: var(--bar); border-radius: 999px; min-width: 2px;
         transition: width .18s ease, background .15s; }
  tr.on .bar { background: var(--bar-on); }
  tr.off .bar { background: var(--bar-off); }
  /* highlighted rows keep the red through all three selection states */
  tr.hl .bar { background: var(--hl); }
  tr.hl.on .bar { background: var(--hl-on); }
  tr.hl.off .bar { background: var(--hl-off); }

  /* month chart. Keeps a minimum bar width so bars stay tappable; on a narrow
     screen that means it scrolls sideways rather than shrinking to slivers. */
  #months { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #months .mgroup { cursor: pointer; }
  #months .mhit { fill: transparent; }
  #months .mgroup:hover .mhit { fill: var(--col-hover); }
  #months .gridline { stroke: var(--grid); }
  #months .yearline { stroke: var(--axis); stroke-dasharray: 2 3; opacity: .7; }
  #months .axisline { stroke: var(--axis); }
  #months .axislabel { fill: var(--muted); font-variant-numeric: tabular-nums; }
  #months .mlabel { fill: var(--muted); }
  #months .mbar { fill: var(--bar); transition: fill .15s; }
  #months .mgroup.on .mbar { fill: var(--bar-on); }
  #months .mgroup.off .mbar { fill: var(--bar-off); }
  #months .mgroup.on .mlabel { fill: var(--accent); font-weight: 600; }

  /* first-paint placeholder, replaced as soon as the data lands */
  .skeleton { color: transparent !important; border-radius: 7px; width: 62%; height: 39px;
              background: linear-gradient(90deg, var(--track) 25%, var(--border) 37%, var(--track) 63%);
              background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }

  @keyframes shimmer { from { background-position: 100% 50%; } to { background-position: 0 50%; } }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  @media (max-width: 640px) {
    body { padding: 0 13px 36px; }
    header { padding: 18px 0 14px; }
    h1 { font-size: 19px; }
    section, .kpi { padding: 15px 16px; margin-bottom: 13px; }
    h2 { margin-bottom: 14px; }
    .grid { gap: 13px; }

    .kpis { grid-template-columns: 1fr; gap: 13px; margin-bottom: 13px; }
    .kpi .value { font-size: 29px; }
    .skeleton { height: 34px; }

    #filters { padding: 10px 12px; gap: 6px; margin-bottom: 13px; }
    .chip { padding: 6px 12px; }                 /* bigger tap target */
    #clear-all { margin-left: 0; padding: 6px 4px; }

    /* Name and value on one line, bar on its own line underneath, so long
       product names are not squeezed into a fixed-width column. */
    table, tbody, tr, td { display: block; }
    tr.row { display: grid; grid-template-columns: 1fr auto; align-items: baseline;
             gap: 5px 10px; padding: 10px 2px; }
    tr.row + tr.row { border-top: 1px solid var(--track); }
    tr.row + tr.row td { border-top: none; }
    tr.row:hover td { background: none; }
    /* Placed explicitly: the bar sits after the value in the markup, but belongs
       on the line below it. */
    td { padding: 0; }
    td.name { width: auto; padding: 0; grid-area: 1 / 1; }
    td.num  { width: auto; padding: 0; grid-area: 1 / 2; }
    td.barcell { grid-area: 2 / 1 / 3 / 3; padding: 0; }
  }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Broking dashboard</h1>
      <p class="sub">Synthetic demo data &middot; revenue and GWP by policy inception date</p>
    </div>
    <button id="theme" aria-pressed="false"></button>
  </header>

  <div id="filters"></div>

  <div class="kpis">
    <div class="kpi">
      <div class="label">Total GWP</div>
      <div class="value skeleton" id="kpi-gwp">&nbsp;</div>
      <div class="note" id="kpi-count">&nbsp;</div>
    </div>
    <div class="kpi">
      <div class="label">Total revenue</div>
      <div class="value skeleton" id="kpi-rev">&nbsp;</div>
      <div class="note" id="kpi-rate">&nbsp;</div>
    </div>
  </div>

  <section><h2>Revenue by month</h2><div id="months"></div></section>

  <div class="grid">
    <section><h2>Revenue by product line</h2><table id="products"></table></section>
    <section><h2>Revenue by account owner</h2><table id="owners"></table></section>
  </div>
</div>

<script>
// --- theme -------------------------------------------------------------
// Follows the operating system until the button is used; after that the
// choice sticks. Storage can throw (private browsing), so it is all guarded.
const systemDark = matchMedia('(prefers-color-scheme: dark)');
const store = {
  get() { try { return localStorage.getItem('theme'); } catch { return null; } },
  set(v) { try { localStorage.setItem('theme', v); } catch {} },
};

function applyTheme(mode) {
  document.documentElement.dataset.theme = mode;
  const btn = document.getElementById('theme');
  const dark = mode === 'dark';
  btn.textContent = dark ? '☀ Light' : '☾ Dark';
  btn.setAttribute('aria-pressed', String(dark));
  btn.title = `Switch to ${dark ? 'light' : 'dark'} mode`;
}

applyTheme(document.documentElement.dataset.theme || 'light');   // set in <head>, sync the button
document.getElementById('theme').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  store.set(next);
  applyTheme(next);
};
// Track the system setting only while the user has not chosen for themselves.
systemDark.addEventListener('change', e => {
  if (!store.get()) applyTheme(e.matches ? 'dark' : 'light');
});

// --- dashboard ---------------------------------------------------------
const money = n => '£' + Math.round(n).toLocaleString('en-GB');
const trim = x => x.toFixed(2).replace(/\.?0+$/, '');   // 1.25 -> "1.25", 50.0 -> "50"
const short = n =>
  n >= 1e6  ? '£' + trim(n / 1e6) + 'm' :
  n >= 1000 ? '£' + trim(n / 1e3) + 'k' :
              '£' + Math.round(n);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthLabel = m => MONTHS[+m.slice(5, 7) - 1] + m.slice(2, 4);

// Round axis values (1 / 2 / 2.5 / 5 x a power of ten) rather than ticking off
// the raw maximum, so the gridlines read as numbers rather than as data.
function niceScale(max, maxTicks = 5) {
  if (!(max > 0)) return { top: 1, ticks: [0, 1] };
  const mag = Math.pow(10, Math.floor(Math.log10(max)) - 1);
  // Smallest round step that still fits the data in maxTicks intervals: the
  // tightest fit, rather than the first step that clears the average.
  const steps = [1, 2, 2.5, 5, 10, 20, 25, 50, 100].map(m => m * mag);
  const step = steps.find(s => Math.ceil(max / s) <= maxTicks) ?? steps[steps.length - 1];
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = 0; v <= top + step / 1e6; v += step) ticks.push(v);
  return { top, ticks };
}

// The three filterable dimensions, keyed to the fields in data.json.
const DIMS = { m: { label: 'Month', fmt: monthLabel },
               p: { label: 'Product line', fmt: v => v },
               o: { label: 'Account owner', fmt: v => v } };

// Categories picked out in red rather than the default blue.
const HIGHLIGHT = { o: ['Eleanor Voss'] };

let DATA = [];                 // every policy
const domain = {};             // dim -> full, stable list of categories
const filters = { m: new Set(), p: new Set(), o: new Set() };

// A row survives if it matches every dimension that has a selection. Passing
// `skip` ignores one dimension, which is how a chart keeps all of its own bars
// while still responding to selections made in the other charts.
const matches = (row, skip) =>
  Object.keys(DIMS).every(d => d === skip || !filters[d].size || filters[d].has(row[d]));

const rowsFor = skip => DATA.filter(r => matches(r, skip));

// Aggregate revenue over the dimension's full domain, so categories that fall to
// zero under the current filters hold their place instead of disappearing.
function agg(rows, dim) {
  const totals = new Map(domain[dim].map(k => [k, 0]));
  for (const r of rows) totals.set(r[dim], totals.get(r[dim]) + r.r);
  return domain[dim].map(name => ({ name, value: totals.get(name) }));
}

function toggle(dim, value) {
  const set = filters[dim];
  set.has(value) ? set.delete(value) : set.add(value);
  render();
}

// Clickable by mouse and by keyboard, for anything that is not a real button.
function makeActivatable(el, fn) {
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  el.onclick = fn;
  el.onkeydown = e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); }
  };
}

function renderFilters() {
  const el = document.getElementById('filters');
  const active = Object.keys(DIMS).flatMap(d => [...filters[d]].map(v => ({ d, v })));

  if (!active.length) {
    el.innerHTML = '<span class="lead">No filters &mdash; click any bar to filter by it.</span>';
    return;
  }
  el.innerHTML = '<span class="lead">Filters:</span>' +
    active.map(({ d, v }) =>
      `<button class="chip" data-dim="${d}" data-value="${v}" title="Remove this filter">` +
      `<span class="dim">${DIMS[d].label}:</span> ${DIMS[d].fmt(v)}<span class="x">&times;</span></button>`
    ).join('') +
    '<button id="clear-all">Clear all</button>';

  el.querySelectorAll('.chip').forEach(c =>
    c.onclick = () => toggle(c.dataset.dim, c.dataset.value));
  el.querySelector('#clear-all').onclick = () => {
    Object.values(filters).forEach(s => s.clear());
    render();
  };
}

function barTable(el, items, dim) {
  const sel = filters[dim];
  const max = Math.max(1, ...items.map(i => i.value));
  el.innerHTML = items.map(i => {
    const state = !sel.size ? '' : sel.has(i.name) ? 'on' : 'off';
    const hl = (HIGHLIGHT[dim] || []).includes(i.name) ? 'hl' : '';
    return `<tr class="row ${state} ${hl}" data-value="${i.name}">
      <td class="name">${i.name}</td>
      <td class="barcell"><div class="track"><div class="bar" style="width:${(i.value / max * 100).toFixed(1)}%"></div></div></td>
      <td class="num">${money(i.value)}</td>
    </tr>`;
  }).join('');
  el.querySelectorAll('tr.row').forEach(tr =>
    makeActivatable(tr, () => toggle(dim, tr.dataset.value)));
}

function monthChart(el, items, dim) {
  const sel = filters[dim];
  const narrow = window.innerWidth <= 640;
  const MIN_BAR = narrow ? 28 : 24;         // keeps bars wide enough to tap
  const H = narrow ? 214 : 268;
  const PAD = { l: narrow ? 46 : 58, r: 10, t: 10, b: 58 };
  // Draw at 1:1 with CSS pixels so type stays the size it is written, whatever
  // the screen. Below the width 30 bars need, the container scrolls instead.
  const W = Math.max(el.clientWidth || 900, items.length * MIN_BAR + PAD.l + PAD.r);
  const { top, ticks } = niceScale(Math.max(...items.map(i => i.value)));
  const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b;
  const bw = iw / items.length;
  const y = v => PAD.t + ih - (v / top) * ih;

  const grid = ticks.map(v =>
    `<line class="gridline" x1="${PAD.l}" y1="${y(v)}" x2="${W - PAD.r}" y2="${y(v)}"></line>
     <text class="axislabel" x="${PAD.l - 10}" y="${y(v) + 4}" text-anchor="end" font-size="11">${short(v)}</text>`
  ).join('');

  // A faint divider where each new year starts, to break up 30 bars.
  const years = items.map((i, n) =>
    n && i.name.endsWith('-01')
      ? `<line class="yearline" x1="${PAD.l + n * bw}" y1="${PAD.t}" x2="${PAD.l + n * bw}" y2="${PAD.t + ih}"></line>`
      : ''
  ).join('');

  const bars = items.map((i, n) => {
    const h = Math.max(0, (i.value / top) * ih);
    const x = PAD.l + n * bw;
    const lx = x + bw / 2, ly = PAD.t + ih + 15;
    const state = !sel.size ? '' : sel.has(i.name) ? 'on' : 'off';
    // The full-height hit rect keeps short and zero-value bars clickable, and
    // gives the whole column a hover state.
    return `<g class="mgroup ${state}" data-value="${i.name}">
              <title>${monthLabel(i.name)}: ${money(i.value)}</title>
              <rect class="mhit" x="${x}" y="${PAD.t}" width="${bw}" height="${ih}"></rect>
              <rect class="mbar" x="${x + 3}" y="${PAD.t + ih - h}" width="${Math.max(1, bw - 6)}"
                    height="${h}" rx="2"></rect>
              <text class="mlabel" x="${lx}" y="${ly}" text-anchor="end" font-size="10.5"
                    transform="rotate(-45 ${lx} ${ly})">${monthLabel(i.name)}</text>
            </g>`;
  }).join('');

  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${grid}${years}${bars}
    <line class="axisline" x1="${PAD.l}" y1="${PAD.t + ih}" x2="${W - PAD.r}" y2="${PAD.t + ih}"></line></svg>`;
  el.querySelectorAll('.mgroup').forEach(g =>
    makeActivatable(g, () => toggle(dim, g.dataset.value)));
}

function render() {
  const shown = rowsFor(null);                       // every filter applied
  const gwp = shown.reduce((a, p) => a + p.g, 0);
  const rev = shown.reduce((a, p) => a + p.r, 0);

  const gwpEl = document.getElementById('kpi-gwp');
  const revEl = document.getElementById('kpi-rev');
  gwpEl.classList.remove('skeleton');
  revEl.classList.remove('skeleton');
  gwpEl.textContent = money(gwp);
  revEl.textContent = money(rev);
  document.getElementById('kpi-count').textContent = shown.length === DATA.length
    ? `${DATA.length} policies`
    : `${shown.length} of ${DATA.length} policies`;
  document.getElementById('kpi-rate').textContent = gwp ? (rev / gwp * 100).toFixed(1) + '% of GWP' : '—';

  renderFilters();
  monthChart(document.getElementById('months'), agg(rowsFor('m'), 'm'), 'm');
  barTable(document.getElementById('products'), agg(rowsFor('p'), 'p'), 'p');
  barTable(document.getElementById('owners'),   agg(rowsFor('o'), 'o'), 'o');
}

fetch('data.json').then(r => r.json()).then(({ policies }) => {
  DATA = policies;
  // Months run in date order; the other two are ranked by overall revenue so the
  // rows stay put as you filter rather than re-sorting under the cursor.
  domain.m = [...new Set(DATA.map(r => r.m))].sort();
  for (const dim of ['p', 'o']) {
    const totals = new Map();
    for (const r of DATA) totals.set(r[dim], (totals.get(r[dim]) || 0) + r.r);
    domain[dim] = [...totals.entries()].sort((a, b) => b[1] - a[1]).map(([k]) => k);
  }
  render();
});

// The month chart is sized to its container, so redraw it after a rotate or
// resize. Filter state lives outside the render, so nothing is lost.
let resizeTimer;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (DATA.length) render(); }, 150);
});
</script>
