<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broking dashboard</title>
<style>
  /* Light is the default; dark is a selected set of steps from the same blue
     ramp, not an inversion. Every bar colour clears 3:1 on its own surface. */
  :root {
    --surface:    #fcfcfb;
    --panel:      #f4f3f0;
    --border:     #dedcd7;
    --grid:       #e6e4df;
    --ink:        #0b0b0b;
    --ink-2:      #52514e;
    --bar:        #2a78d6;  /* 4.30:1 */
    --bar-on:     #184f95;  /* 7.89:1 - selected, most prominent */
    --bar-off:    #8e8e8a;  /* 3.20:1 - neutral grey, identity removed */
    --chip-bg:    #e7eefb;
    --chip-br:    #b9cdea;
    --chip-ink:   #1c5cab;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface:  #1a1a19;
      --panel:    #232322;
      --border:   #383835;
      --grid:     #2f2f2d;
      --ink:      #ffffff;
      --ink-2:    #c3c2b7;
      --bar:      #3987e5;  /* 4.79:1 */
      --bar-on:   #86b6ef;  /* 8.25:1 - selected, most prominent */
      --bar-off:  #6b6b67;  /* 3.25:1 */
      --chip-bg:  #1e2b3d;
      --chip-br:  #34527d;
      --chip-ink: #9ec5f4;
    }
  }
  :root[data-theme="dark"] {
    --surface:  #1a1a19;
    --panel:    #232322;
    --border:   #383835;
    --grid:     #2f2f2d;
    --ink:      #ffffff;
    --ink-2:    #c3c2b7;
    --bar:      #3987e5;
    --bar-on:   #86b6ef;
    --bar-off:  #6b6b67;
    --chip-bg:  #1e2b3d;
    --chip-br:  #34527d;
    --chip-ink: #9ec5f4;
  }

  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px 32px;
         color: var(--ink); background: var(--surface); }
  header { display: flex; align-items: flex-start; gap: 16px; }
  header .titles { flex: 1 1 auto; min-width: 0; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--ink-2); font-size: 13px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--ink-2); margin: 32px 0 12px; }

  #theme-toggle { flex: 0 0 auto; font: inherit; font-size: 13px; cursor: pointer;
                  border: 1px solid var(--border); background: var(--panel);
                  color: var(--ink); padding: 6px 12px; min-height: 34px; }

  /* Active filters */
  #filters { border: 1px solid var(--border); background: var(--panel);
             padding: 10px 12px; margin: 16px 0 20px; font-size: 13px; }
  #filters .none { color: var(--ink-2); }
  .chip { display: inline-block; border: 1px solid var(--chip-br); background: var(--chip-bg);
          color: var(--chip-ink); padding: 5px 9px; margin: 2px 6px 2px 0; cursor: pointer; }
  .chip b { font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
            opacity: .75; margin-right: 6px; font-weight: 600; }
  .chip .x { margin-left: 8px; opacity: .8; }
  #clear-all { font: inherit; font-size: 13px; border: 1px solid var(--border);
               background: var(--surface); color: var(--ink);
               padding: 5px 10px; margin-left: 4px; cursor: pointer; }

  .headlines { display: flex; gap: 16px; flex-wrap: wrap; }
  .kpi { border: 1px solid var(--border); padding: 16px 20px;
         flex: 1 1 220px; min-width: 0; }
  .kpi .label { font-size: 12px; text-transform: uppercase;
                letter-spacing: .06em; color: var(--ink-2); }
  .kpi .value { font-size: 30px; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .kpi .note { font-size: 12px; color: var(--ink-2); margin-top: 4px; }

  /* Bar rows: grid, so they can restack on a narrow screen */
  .row { display: grid; grid-template-columns: 180px minmax(0, 1fr) 62px;
         gap: 10px; align-items: center; padding: 4px 0; cursor: pointer; }
  .rname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
  .rval { text-align: right; font-variant-numeric: tabular-nums;
          color: var(--ink-2); font-size: 13px; white-space: nowrap; }
  .row:hover .rname { text-decoration: underline; }
  .bar { display: block; height: 15px; background: var(--bar);
         border-radius: 0 3px 3px 0; }
  .bar.on  { background: var(--bar-on); }
  .bar.off { background: var(--bar-off); }

  #chart-month svg { display: block; width: 100%; }
  #chart-month rect { fill: var(--bar); cursor: pointer; }
  #chart-month rect.on  { fill: var(--bar-on); }
  #chart-month rect.off { fill: var(--bar-off); }
  #chart-month .grid { stroke: var(--grid); }
  #chart-month text { fill: var(--ink-2); }

  @media (max-width: 640px) {
    body { padding: 16px; }
    h1 { font-size: 18px; }
    .kpi { flex: 1 1 100%; padding: 12px 14px; }
    .kpi .value { font-size: 26px; }
    /* name + value on the first line, bar spanning underneath */
    .row { grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 7px 0; }
    .rname { grid-area: 1 / 1; }
    .rval  { grid-area: 1 / 2; }
    .rbar  { grid-area: 2 / 1 / 3 / 3; }
  }
</style>
</head>
<body>

<header>
  <div class="titles">
    <h1>Broking dashboard</h1>
    <div class="sub" id="sub">Loading...</div>
  </div>
  <button id="theme-toggle" type="button">Dark</button>
</header>

<div id="filters"><span class="none">Loading...</span></div>

<div class="headlines">
  <div class="kpi">
    <div class="label">Total GWP</div>
    <div class="value" id="kpi-gwp">&mdash;</div>
    <div class="note" id="kpi-gwp-note"></div>
  </div>
  <div class="kpi">
    <div class="label">Total revenue</div>
    <div class="value" id="kpi-rev">&mdash;</div>
    <div class="note" id="kpi-rev-note"></div>
  </div>
</div>

<h2>Revenue by month</h2>
<div id="chart-month"></div>

<h2>Revenue by product line</h2>
<div id="chart-product"></div>

<h2>Revenue by account owner</h2>
<div id="chart-owner"></div>

<script>
/* ---------- theme ---------- */
const root = document.documentElement;
const tbtn = document.getElementById('theme-toggle');

function systemDark() {
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function currentTheme() {
  return root.dataset.theme || (systemDark() ? 'dark' : 'light');
}
function applyTheme(t) {
  if (t) root.dataset.theme = t;
  // The button offers the other mode.
  tbtn.textContent = currentTheme() === 'dark' ? 'Light' : 'Dark';
}
try {
  const saved = localStorage.getItem('theme');
  if (saved === 'light' || saved === 'dark') root.dataset.theme = saved;
} catch (e) { /* private mode, blocked storage - fall back to system */ }
applyTheme();

tbtn.addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('theme', next); } catch (e) { /* ignore */ }
});
// Follow the OS while the user has not made an explicit choice.
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!root.dataset.theme) applyTheme();
  });
}

/* ---------- helpers ---------- */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const money0 = n => '£' + Math.round(n).toLocaleString('en-GB');
const money1 = n => '£' + (n / 1e6).toFixed(2) + 'm';
const moneyK = n => n === 0 ? '£0' : '£' + Math.round(n / 1000).toLocaleString('en-GB') + 'k';
const monthLabel = k => MON[+k.slice(5, 7) - 1] + k.slice(2, 4);
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const DIMS = {
  month:   { title: 'Month',   of: p => p.inception.slice(0, 7), label: monthLabel },
  product: { title: 'Product', of: p => p.product, label: k => k },
  owner:   { title: 'Owner',   of: p => p.owner,   label: k => k },
};

const filters = { month: new Set(), product: new Set(), owner: new Set() };
let POLICIES = [];
let ORDER = {};   // fixed category order per dimension, so bars never jump about

// A row survives if it matches every dimension that has a selection, skipping
// `except`. Leaving a chart's own dimension out is what keeps all of its bars
// on screen while the other charts narrow.
function matches(p, except) {
  for (const dim in filters) {
    if (dim === except) continue;
    const sel = filters[dim];
    if (sel.size && !sel.has(DIMS[dim].of(p))) return false;
  }
  return true;
}
function rowsFor(except) { return POLICIES.filter(p => matches(p, except)); }

// Revenue per category, seeded with every category so empty ones stay visible.
function totals(dim, rows) {
  const m = new Map(ORDER[dim].map(k => [k, 0]));
  for (const p of rows) {
    const k = DIMS[dim].of(p);
    if (m.has(k)) m.set(k, m.get(k) + p.revenue);
  }
  return m;
}
function toggle(dim, key) {
  const sel = filters[dim];
  sel.has(key) ? sel.delete(key) : sel.add(key);
  render();
}
// '' when nothing is picked in this dimension, so bars keep the base colour.
function stateClass(dim, key) {
  const sel = filters[dim];
  if (!sel.size) return '';
  return sel.has(key) ? ' on' : ' off';
}

/* ---------- charts ---------- */
function barRows(el, dim) {
  const m = totals(dim, rowsFor(dim));
  const max = Math.max(1, ...m.values());
  el.innerHTML = ORDER[dim].map(k => {
    const v = m.get(k);
    const w = (v / max) * 100;
    return `<div class="row" data-dim="${dim}" data-key="${esc(k)}"
                 title="${esc(DIMS[dim].label(k))}: ${money0(v)}">
      <div class="rname">${esc(DIMS[dim].label(k))}</div>
      <div class="rbar"><span class="bar${stateClass(dim, k)}"
           style="width:${w}%${v > 0 ? ';min-width:2px' : ''}"></span></div>
      <div class="rval">${moneyK(v)}</div>
    </div>`;
  }).join('');
}

function monthChart(el) {
  const m = totals('month', rowsFor('month'));
  const keys = ORDER.month;
  const W = Math.max(320, el.clientWidth || 900);
  const narrow = W < 640;
  const H = narrow ? 200 : 240;
  const pad = { t: 8, r: 4, b: narrow ? 42 : 48, l: narrow ? 44 : 62 };
  const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;
  const max = Math.max(1, ...m.values());
  const step = plotW / keys.length;
  const fs = narrow ? 9 : 10;
  // Label every nth month, so labels never collide at whatever width we got.
  const every = Math.max(1, Math.ceil((fs * 2.9) / step));

  const bars = keys.map((k, i) => {
    const h = (m.get(k) / max) * plotH;
    return `<rect class="${stateClass('month', k).trim()}" data-dim="month" data-key="${k}"
                  x="${(pad.l + i * step + 1).toFixed(1)}" y="${(pad.t + plotH - h).toFixed(1)}"
                  width="${Math.max(1, step - 2).toFixed(1)}" height="${h.toFixed(1)}"
            ><title>${monthLabel(k)}: ${money0(m.get(k))}</title></rect>`;
  }).join('');

  const grid = [0, 0.5, 1].map(f => {
    const y = pad.t + plotH - f * plotH;
    return `<line class="grid" x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}"/>
            <text x="${pad.l - 6}" y="${y + 4}" text-anchor="end"
                  font-size="${fs + 1}">${moneyK(max * f)}</text>`;
  }).join('');

  const labels = keys.map((k, i) => {
    if (i % every) return '';
    const x = pad.l + i * step + step / 2, y = pad.t + plotH + 10;
    return `<text x="${x.toFixed(1)}" y="${y}" text-anchor="end" font-size="${fs}"
                  transform="rotate(-45 ${x.toFixed(1)} ${y})">${monthLabel(k)}</text>`;
  }).join('');

  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${grid}${bars}${labels}</svg>`;
}

function renderFilters() {
  const el = document.getElementById('filters');
  const chips = [];
  for (const dim in DIMS)
    for (const k of ORDER[dim])
      if (filters[dim].has(k))
        chips.push(`<span class="chip" data-dim="${dim}" data-key="${esc(k)}"
            title="Remove this filter"><b>${DIMS[dim].title}</b>${esc(DIMS[dim].label(k))}<span class="x">&times;</span></span>`);

  el.innerHTML = chips.length
    ? chips.join('') + '<button id="clear-all" type="button">Clear all</button>'
    : '<span class="none">No filters. Tap any bar to filter the rest; tap it again to clear.</span>';
}

function render() {
  const shown = rowsFor(null);
  const gwp = shown.reduce((s, p) => s + p.gwp, 0);
  const rev = shown.reduce((s, p) => s + p.revenue, 0);

  document.getElementById('kpi-gwp').textContent = money1(gwp);
  document.getElementById('kpi-gwp-note').textContent = money0(gwp);
  document.getElementById('kpi-rev').textContent = money1(rev);
  document.getElementById('kpi-rev-note').textContent = gwp
    ? money0(rev) + ' · ' + (rev / gwp * 100).toFixed(1) + '% of GWP'
    : money0(rev);

  const any = Object.values(filters).some(s => s.size);
  document.getElementById('sub').textContent = any
    ? `${shown.length} of ${POLICIES.length} policies match the current filters`
    : `${POLICIES.length} policies · inceptions ${ORDER.month[0]} to ${ORDER.month[ORDER.month.length - 1]}`;

  renderFilters();
  monthChart(document.getElementById('chart-month'));
  barRows(document.getElementById('chart-product'), 'product');
  barRows(document.getElementById('chart-owner'), 'owner');
}

// One delegated handler covers bars, rows and filter chips alike.
document.addEventListener('click', e => {
  if (e.target.closest('#clear-all')) {
    for (const dim in filters) filters[dim].clear();
    return render();
  }
  const hit = e.target.closest('[data-dim][data-key]');
  if (hit) toggle(hit.getAttribute('data-dim'), hit.getAttribute('data-key'));
});

// The month chart is drawn at real pixel width, so it needs redrawing on resize.
let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { if (POLICIES.length) monthChart(document.getElementById('chart-month')); }, 120);
});

fetch('data.json')
  .then(r => r.json())
  .then(({ policies }) => {
    POLICIES = policies;

    // Category order is fixed once, from the unfiltered book, so bars keep their
    // place as filters change. Months run as a continuous axis.
    const byRev = dim => {
      const m = new Map();
      for (const p of policies) {
        const k = DIMS[dim].of(p);
        m.set(k, (m.get(k) || 0) + p.revenue);
      }
      return [...m.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
    };
    ORDER.product = byRev('product');
    ORDER.owner = byRev('owner');

    const ms = policies.map(p => p.inception.slice(0, 7)).sort();
    const months = [];
    let [y, mo] = ms[0].split('-').map(Number);
    const [ly, lmo] = ms[ms.length - 1].split('-').map(Number);
    while (y < ly || (y === ly && mo <= lmo)) {
      months.push(`${y}-${String(mo).padStart(2, '0')}`);
      if (++mo > 12) { mo = 1; y++; }
    }
    ORDER.month = months;

    render();
  })
  .catch(e => {
    document.getElementById('sub').textContent = 'Could not load data.json: ' + e.message;
    document.getElementById('filters').innerHTML = '';
  });
</script>

</body>
</html>
