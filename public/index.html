<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broking dashboard</title>
<style>
  /* One accent hue carries the single measure (revenue); the red is a deliberate
     highlight on one account owner. Both validated for contrast and colour-vision
     separation against each surface. */
  :root {
    --plane: #f9f9f7;      --surface: #fcfcfb;
    --ink: #0b0b0b;        --ink-2: #52514e;     --muted: #898781;
    --grid: #e1e0d9;       --baseline: #c3c2b7;  --border: rgba(11, 11, 11, 0.10);
    --hover: #f2f1ed;      --chip: #f2f1ed;
    --bar: #2a78d6;        --bar-off: #9ec5f4;
    --bar-alt: #e34948;    --bar-alt-off: #f2b3b2;
  }
  [data-theme="dark"] {
    --plane: #0d0d0d;      --surface: #1a1a19;
    --ink: #ffffff;        --ink-2: #c3c2b7;     --muted: #898781;
    --grid: #2c2c2a;       --baseline: #383835;  --border: rgba(255, 255, 255, 0.10);
    --hover: #232321;      --chip: #232321;
    --bar: #3987e5;        --bar-off: #1c5cab;
    --bar-alt: #e66767;    --bar-alt-off: #7a3230;
  }

  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 24px 64px;
         font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
         color: var(--ink); background: var(--plane);
         -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 960px; margin: 0 auto; }

  .topbar { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
  h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin: 3px 0 0; }
  .btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
         border-radius: 7px; cursor: pointer; font: inherit; font-size: 13px;
         padding: 6px 12px; white-space: nowrap; }
  .btn:hover { background: var(--hover); color: var(--ink); }
  #theme-toggle { margin-left: auto; }

  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: 10px; padding: 20px 22px; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .cap { color: var(--muted); font-size: 12px; margin: 0 0 16px; }

  .filters { display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
             padding: 12px 14px; margin-bottom: 16px; }
  .filters .lead { color: var(--muted); font-size: 13px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: var(--chip);
          border: 1px solid var(--border); border-radius: 999px;
          padding: 4px 5px 4px 12px; font-size: 13px; color: var(--ink); }
  .chip .dim { color: var(--muted); }
  .chip button { border: 0; background: none; cursor: pointer; color: var(--muted);
                 font-size: 15px; line-height: 1; padding: 2px 6px; border-radius: 999px; }
  .chip button:hover { color: var(--ink); background: var(--hover); }
  #clear-all { margin-left: auto; }

  .tiles { display: flex; gap: 16px; margin-bottom: 16px; }
  .tile { flex: 1 1 0; }
  .tile .label { color: var(--muted); font-size: 12px; }
  .tile .value { font-size: 38px; font-weight: 600; line-height: 1.1;
                 letter-spacing: -0.02em; margin-top: 6px; }
  .tile .note { color: var(--ink-2); font-size: 12px; margin-top: 6px; }

  .stack { display: flex; flex-direction: column; gap: 16px; }

  table.bars { border-collapse: collapse; width: 100%; }
  .bars tr { cursor: pointer; }
  .bars tr:hover td { background: var(--hover); }
  .bars td { padding: 5px 0; vertical-align: middle; }
  .bars td.name { white-space: nowrap; padding-right: 14px; color: var(--ink); }
  .bars td.val { text-align: right; white-space: nowrap; padding-left: 14px;
                 color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .barcell { width: 100%; }
  /* Square at the baseline, 4px rounded at the data end. */
  .bar { display: block; height: 15px; background: var(--bar);
         border-radius: 0 4px 4px 0; min-width: 2px; }
  tr[data-value="Eleanor Voss"] .bar { background: var(--bar-alt); }
  .off .bar { background: var(--bar-off); }
  .off td.name, .off td.val { color: var(--muted); }
  .off[data-value="Eleanor Voss"] .bar { background: var(--bar-alt-off); }
  .on td.name { font-weight: 600; }

  svg { display: block; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-line { stroke: var(--baseline); stroke-width: 1; }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .col { fill: var(--bar); }
  .col.off { fill: var(--bar-off); }
  .hit { fill: transparent; cursor: pointer; }
  .mlabel.on { fill: var(--ink); font-weight: 600; }

  details.tv { margin-top: 14px; }
  details.tv summary { color: var(--muted); font-size: 12px; cursor: pointer;
                       width: max-content; }
  details.tv summary:hover { color: var(--ink); }
  table.tv-table { border-collapse: collapse; margin-top: 10px; font-size: 12px;
                   font-variant-numeric: tabular-nums; }
  .tv-table th { text-align: left; font-weight: 600; color: var(--muted);
                 padding: 3px 20px 3px 0; }
  .tv-table td { padding: 3px 20px 3px 0; color: var(--ink-2); }

  #tip { position: fixed; z-index: 10; pointer-events: none; display: none;
         background: var(--surface); color: var(--ink); border: 1px solid var(--border);
         border-radius: 8px; padding: 8px 11px; font-size: 12px; line-height: 1.45;
         box-shadow: 0 4px 14px rgba(0, 0, 0, 0.13); max-width: 230px; }
  #tip .t-name { font-weight: 600; }
  #tip .t-val { font-variant-numeric: tabular-nums; }
  #tip .t-sub { color: var(--muted); }

  @media (max-width: 640px) {
    body { padding: 18px 14px 44px; }
    h1 { font-size: 19px; }
    .card { padding: 16px; border-radius: 9px; }
    .tiles { flex-direction: column; gap: 12px; }
    .tile .value { font-size: 32px; }

    .bars tr { display: grid; grid-template-columns: 1fr auto; column-gap: 12px;
               padding: 8px 0; border-bottom: 1px solid var(--grid); }
    .bars tr:last-child { border-bottom: 0; }
    .bars tr:hover td { background: none; }
    .bars td { display: block; padding: 0; }
    .bars td.name { grid-column: 1; grid-row: 1; white-space: normal; padding-right: 0; }
    .bars td.val { grid-column: 2; grid-row: 1; padding-left: 0; }
    .bars td.barcell { grid-column: 1 / -1; grid-row: 2; margin-top: 6px; }
  }
</style>
<script>
  // Set before first paint so a dark-mode reload never flashes light.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var dark = saved ? saved === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <h1>Broking dashboard</h1>
      <p class="sub" id="sub">Loading…</p>
    </div>
    <button class="btn" id="theme-toggle">Dark mode</button>
  </div>

  <div class="card filters" id="filters"></div>

  <div class="tiles">
    <div class="card tile">
      <div class="label">Total GWP</div>
      <div class="value" id="kpi-gwp">—</div>
      <div class="note" id="kpi-gwp-note">&nbsp;</div>
    </div>
    <div class="card tile">
      <div class="label">Total revenue</div>
      <div class="value" id="kpi-rev">—</div>
      <div class="note" id="kpi-rev-note">&nbsp;</div>
    </div>
    <div class="card tile">
      <div class="label">Policies</div>
      <div class="value" id="kpi-pol">—</div>
      <div class="note" id="kpi-pol-note">&nbsp;</div>
    </div>
  </div>

  <div class="stack">
    <section class="card">
      <h2>Revenue by month</h2>
      <p class="cap">By inception date. Click a column to filter.</p>
      <div id="chart-month"></div>
      <details class="tv">
        <summary>Show monthly values</summary>
        <div id="month-table"></div>
      </details>
    </section>

    <section class="card">
      <h2>Revenue by product line</h2>
      <p class="cap">Click a row to filter.</p>
      <table class="bars" id="chart-product"></table>
    </section>

    <section class="card">
      <h2>Revenue by account owner</h2>
      <p class="cap">Click a row to filter.</p>
      <table class="bars" id="chart-owner"></table>
    </section>
  </div>

</div>
<div id="tip"></div>

<script>
const gbp0 = n => '£' + Math.round(n).toLocaleString('en-GB');
const gbpM = n => '£' + (n / 1e6).toFixed(2) + 'm';
// Bar-end labels: whole thousands. The tooltip and the table keep the exact figure.
const gbpK = n => n >= 1000 ? '£' + Math.round(n / 1000).toLocaleString('en-GB') + 'k'
                            : '£' + Math.round(n);

// '2024-01' -> 'Jan24'
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthLabel = m => MONTHS[Number(m.slice(5, 7)) - 1] + m.slice(2, 4);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// The three things you can filter by. Each has a chart, a way to read its value
// off a policy row, and its own set of selected values.
const DIMS = {
  month:   { label: 'Month',         value: p => p.inception.slice(0, 7), format: monthLabel },
  product: { label: 'Product line',  value: p => p.productLine,           format: v => v },
  owner:   { label: 'Account owner', value: p => p.owner,                 format: v => v },
};

let POLICIES = [];
let CATS = {};                       // every value each dimension can take, fixed up front
const state = { month: new Set(), product: new Set(), owner: new Set() };

// Rows passing every filter except the one named; pass null to apply them all.
// Leaving a chart's own filter out is what keeps all of its bars on screen.
function rowsExcept(skip) {
  const active = Object.keys(DIMS).filter(d => d !== skip && state[d].size);
  if (!active.length) return POLICIES;
  return POLICIES.filter(p => active.every(d => state[d].has(DIMS[d].value(p))));
}

function aggregate(dim, rows) {
  const out = new Map(CATS[dim].map(c => [c, { rev: 0, n: 0 }]));  // keep empty categories visible
  for (const p of rows) {
    const slot = out.get(DIMS[dim].value(p));
    if (slot) { slot.rev += p.revenue; slot.n++; }
  }
  return out;
}

function toggle(dim, value) {
  state[dim].has(value) ? state[dim].delete(value) : state[dim].add(value);
  hideTip();
  render();
}

/* ---------- rendering ---------- */

function renderFilters() {
  const chips = [];
  for (const dim of Object.keys(DIMS)) {
    for (const v of state[dim]) {
      chips.push('<span class="chip"><span class="dim">' + DIMS[dim].label + '</span>' +
        esc(DIMS[dim].format(v)) +
        '<button data-dim="' + dim + '" data-value="' + esc(v) + '" title="Remove">&times;</button></span>');
    }
  }
  document.getElementById('filters').innerHTML = chips.length
    ? '<span class="lead">Filtered by</span>' + chips.join('') +
      '<button class="btn" id="clear-all">Clear all</button>'
    : '<span class="lead">Click any bar to filter. Click it again to clear.</span>';
}

function renderBars(elId, dim) {
  const totals = aggregate(dim, rowsExcept(dim));
  const entries = [...totals.entries()].sort((a, b) => b[1].rev - a[1].rev);
  const max = Math.max(1, ...entries.map(e => e[1].rev));
  const anySel = state[dim].size > 0;

  document.getElementById(elId).innerHTML = entries.map(([name, d]) => {
    const sel = state[dim].has(name);
    return '<tr class="' + (sel ? 'on' : (anySel ? 'off' : '')) + '" data-dim="' + dim +
      '" data-value="' + esc(name) + '" data-label="' + esc(name) +
      '" data-rev="' + d.rev + '" data-n="' + d.n + '">' +
      '<td class="name">' + esc(name) + '</td>' +
      '<td class="barcell"><span class="bar" style="width:' + (d.rev / max * 100).toFixed(1) + '%"></span></td>' +
      '<td class="val">' + gbpK(d.rev) + '</td></tr>';
  }).join('');
}

// Round axis steps to 1/2/2.5/5 x 10^n, so ticks land on clean numbers.
function niceStep(rawMax, count) {
  const raw = rawMax / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}

// Square at the baseline, 4px rounded at the data end.
function colPath(x, y, w, h, r) {
  if (h <= 0.5) return '';
  r = Math.min(r, w / 2, h);
  return 'M' + x + ' ' + (y + h) + 'V' + (y + r) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + (-r) +
         'h' + (w - 2 * r) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r + 'V' + (y + h) + 'Z';
}

function renderMonths() {
  const el = document.getElementById('chart-month');
  const totals = aggregate('month', rowsExcept('month'));
  const entries = CATS.month.map(m => [m, totals.get(m)]);   // fixed axis, never reorders
  const anySel = state.month.size > 0;

  // The viewBox matches the container's real pixel width, so the chart fills the
  // screen on a phone without shrinking the axis text to nothing.
  const W = Math.max(300, Math.min(960, el.clientWidth || 900));
  const narrow = W < 560;
  const H = narrow ? 190 : 250;
  const padL = narrow ? 42 : 58, padR = 4, padT = 10, padB = narrow ? 28 : 32;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const peak = Math.max(1, ...entries.map(e => e[1].rev));
  const tickStep = niceStep(peak, narrow ? 3 : 5);
  const max = Math.ceil(peak / tickStep) * tickStep;   // top gridline is a round number
  const step = plotW / entries.length;
  const bw = Math.min(24, Math.max(2, step - 2));   // capped thickness, 2px gap between neighbours
  const y = v => padT + plotH - (v / max) * plotH;
  const tick = n => narrow ? (n >= 1000 ? '£' + Math.round(n / 1000) + 'k' : '£' + Math.round(n))
                           : gbp0(n);

  const levels = [];
  for (let t = 0; t <= max + 0.5; t += tickStep) levels.push(t);
  const grid = levels.map(t =>
    '<line class="grid-line" x1="' + padL + '" y1="' + y(t) + '" x2="' + (W - padR) + '" y2="' + y(t) + '"/>' +
    '<text class="tick" x="' + (padL - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end">' + tick(t) + '</text>'
  ).join('');

  const cols = entries.map(([m, d], i) => {
    const sel = state.month.has(m);
    const x = padL + i * step;
    const top = y(d.rev);
    // A full-height transparent rect over each slot keeps short columns tappable.
    return '<path class="col' + (sel || !anySel ? '' : ' off') + '" d="' +
             colPath(+(x + (step - bw) / 2).toFixed(1), +top.toFixed(1), +bw.toFixed(1),
                     +(padT + plotH - top).toFixed(1), 4) + '"/>' +
           '<rect class="hit" data-dim="month" data-value="' + m + '" data-label="' + monthLabel(m) +
             '" data-rev="' + d.rev + '" data-n="' + d.n + '" x="' + x.toFixed(1) +
             '" y="' + padT + '" width="' + step.toFixed(1) + '" height="' + plotH + '"/>';
  }).join('');

  // Label as often as the width allows, plus any month currently selected.
  const every = Math.max(1, Math.ceil(44 / step));
  const selIdx = entries.map(([m], i) => state.month.has(m) ? i : -1).filter(i => i >= 0);
  const labels = entries.map(([m], i) => {
    const sel = state.month.has(m);
    // Drop a routine label if a selected month's label sits close enough to collide.
    if (!sel && (i % every || selIdx.some(j => Math.abs(i - j) < every))) return '';
    return '<text class="tick mlabel' + (sel ? ' on' : '') + '" x="' +
           (padL + i * step + step / 2).toFixed(1) + '" y="' + (H - padB + 17) +
           '" text-anchor="middle">' + monthLabel(m) + '</text>';
  }).join('');

  el.innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">' + grid +
    '<line class="axis-line" x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (W - padR) +
    '" y2="' + (padT + plotH) + '"/>' + cols + labels + '</svg>';

  // Table view, so the monthly numbers are not locked inside a hover tooltip.
  document.getElementById('month-table').innerHTML =
    '<table class="tv-table"><tr><th>Month</th><th>Revenue</th><th>Policies</th></tr>' +
    entries.map(([m, d]) => '<tr><td>' + monthLabel(m) + '</td><td>' + gbp0(d.rev) +
      '</td><td>' + d.n + '</td></tr>').join('') + '</table>';
}

function renderKpis() {
  const rows = rowsExcept(null);
  const gwp = rows.reduce((a, p) => a + p.gwp, 0);
  const rev = rows.reduce((a, p) => a + p.revenue, 0);
  const filtered = rows.length !== POLICIES.length;

  document.getElementById('kpi-gwp').textContent = gbpM(gwp);
  document.getElementById('kpi-gwp-note').textContent = gbp0(gwp);
  document.getElementById('kpi-rev').textContent = gbpM(rev);
  document.getElementById('kpi-rev-note').textContent =
    gbp0(rev) + (gwp ? ' · ' + (rev / gwp * 100).toFixed(1) + '% of GWP' : '');
  document.getElementById('kpi-pol').textContent = rows.length.toLocaleString('en-GB');
  document.getElementById('kpi-pol-note').textContent = filtered
    ? 'of ' + POLICIES.length.toLocaleString('en-GB') + ' · ' +
      Math.round(rows.length / POLICIES.length * 100) + '% of the book'
    : 'the whole book';
}

function render() {
  renderFilters();
  renderKpis();
  renderMonths();
  renderBars('chart-product', 'product');
  renderBars('chart-owner', 'owner');
}

/* ---------- hover tooltip ---------- */

const tip = document.getElementById('tip');
function hideTip() { tip.style.display = 'none'; }

function showTip(el, e) {
  const rev = Number(el.dataset.rev), n = Number(el.dataset.n);
  tip.innerHTML = '<div class="t-name">' + esc(el.dataset.label) + '</div>' +
    '<div class="t-val">' + gbp0(rev) + '</div>' +
    '<div class="t-sub">' + n + (n === 1 ? ' policy' : ' policies') + '</div>';
  tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(e.clientX + 14, window.innerWidth - r.width - 8)) + 'px';
  tip.style.top = Math.max(8, e.clientY - r.height - 12) + 'px';
}

/* ---------- wiring ---------- */

// One delegated set of listeners per container: the charts are redrawn on every
// click, so listeners on the marks themselves would need reattaching each time.
for (const id of ['chart-month', 'chart-product', 'chart-owner']) {
  const box = document.getElementById(id);
  box.addEventListener('click', e => {
    const t = e.target.closest('[data-dim]');
    if (t) toggle(t.dataset.dim, t.dataset.value);
  });
  box.addEventListener('mousemove', e => {
    const t = e.target.closest('[data-dim]');
    t ? showTip(t, e) : hideTip();
  });
  box.addEventListener('mouseleave', hideTip);
}

document.getElementById('filters').addEventListener('click', e => {
  if (e.target.id === 'clear-all') {
    Object.values(state).forEach(s => s.clear());
    return render();
  }
  const b = e.target.closest('button[data-dim]');
  if (b) toggle(b.dataset.dim, b.dataset.value);
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (POLICIES.length) renderMonths(); }, 120);
});

const themeBtn = document.getElementById('theme-toggle');
function applyTheme(dark) {
  const root = document.documentElement;
  dark ? root.setAttribute('data-theme', 'dark') : root.removeAttribute('data-theme');
  themeBtn.textContent = dark ? 'Light mode' : 'Dark mode';
  try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
}
applyTheme(document.documentElement.getAttribute('data-theme') === 'dark');
themeBtn.addEventListener('click', () =>
  applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark'));

fetch('data.json')
  .then(r => r.json())
  .then(({ policies }) => {
    POLICIES = policies;

    // Category lists come from the unfiltered data once, so bars and the month
    // axis stay put instead of appearing and disappearing as you filter.
    const seen = [...new Set(policies.map(DIMS.month.value))].sort();
    const months = [];
    for (let m = seen[0]; m <= seen[seen.length - 1];) {
      months.push(m);
      let [yy, mm] = m.split('-').map(Number);
      mm === 12 ? (yy++, mm = 1) : mm++;
      m = yy + '-' + String(mm).padStart(2, '0');
    }
    const byRevenue = dim => {
      const t = new Map();
      for (const p of policies) {
        const k = DIMS[dim].value(p);
        t.set(k, (t.get(k) || 0) + p.revenue);
      }
      return [...t.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
    };
    CATS = { month: months, product: byRevenue('product'), owner: byRevenue('owner') };

    document.getElementById('sub').textContent = 'Policies incepting ' +
      monthLabel(months[0]) + ' to ' + monthLabel(months[months.length - 1]) +
      ' · synthetic demo data';

    render();
  })
  .catch(e => { document.getElementById('sub').textContent = 'Could not load data.json: ' + e.message; });
</script>

</body>
</html>
