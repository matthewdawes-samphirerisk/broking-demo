<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broking dashboard</title>
<style>
  :root {
    --ink: #1b2a33;
    --muted: #6b7a82;
    --panel: #f2f4f5;
    --amber: #e08a3c;
    --slate: #3e6b7a;
    --line: #dde3e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Calibri, Arial, sans-serif;
    color: var(--ink);
    background: #fff;
  }
  header {
    background: var(--ink);
    color: #fff;
    padding: 20px 28px;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 13px; color: #aebdc4; }
  main { padding: 24px 28px 48px; max-width: 1400px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .kpi { background: var(--panel); border-radius: 6px; padding: 16px 18px; }
  .kpi .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .kpi .value { font-size: 28px; font-weight: 600; margin-top: 6px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 26px; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 18px; overflow-x: auto; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; font-size: 13px;
             border-radius: 4px; padding: 2px 4px; margin-left: -4px; }
  .bar-row .name { width: 190px; flex: none; color: var(--ink); }
  .bar-row .track { flex: 1; background: var(--panel); height: 18px; border-radius: 3px; }
  .bar-row .fill { background: var(--slate); height: 18px; border-radius: 3px; transition: width .18s ease; }
  .bar-row .val { width: 90px; flex: none; text-align: right; color: var(--muted); }

  /* click a bar to filter everything else by it */
  .bar-row.clickable { cursor: pointer; }
  .bar-row.clickable:hover { background: #eef2f4; }
  .bar-row.selected { background: #fbeee1; }
  .bar-row.selected .fill { background: var(--amber); }
  .bar-row.selected .name { font-weight: 600; }
  #chart-month .mbar { cursor: pointer; }
  .kpi .value .of { font-size: 15px; font-weight: 400; color: var(--muted); }

  /* active-filter bar */
  #filters { display: none; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
  #filters .flabel { font-size: 12px; color: var(--muted);
                     text-transform: uppercase; letter-spacing: .5px; }
  #filters .chip { font: inherit; font-size: 13px; cursor: pointer; padding: 5px 11px;
                   border: 1px solid var(--line); border-radius: 14px;
                   background: #fbeee1; color: var(--ink); }
  #filters .chip:hover { border-color: var(--amber); }
  #filters .chip.clear { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* data quality / reconciliation panel */
  .dq { margin-top: 26px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .dq h2 { margin: 0; padding: 14px 18px; font-size: 15px; background: var(--ink); color: #fff; }
  .dq table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .dq td { padding: 8px 18px; border-bottom: 1px solid var(--line); }
  .dq td.num { text-align: right; width: 160px; font-variant-numeric: tabular-nums; }
  .dq tr.total td { font-weight: 600; border-top: 2px solid var(--ink); border-bottom: none; }
  .dq tr.note td { color: var(--muted); font-size: 12px; }
  .dq .adj { color: var(--muted); }
  .dq-scroll { overflow-x: auto; }

  .status { padding: 14px 18px; border-radius: 6px; background: var(--panel);
            font-size: 14px; color: var(--muted); margin-bottom: 18px; }
  .status.error { background: #fbeae6; color: #8a2f16; border: 1px solid #e8c0b3; }

  /* sign-in */
  #gate { display: none; max-width: 380px; margin: 60px auto; }
  #gate h2 { margin: 0 0 6px; font-size: 19px; }
  #gate p.sub { margin: 0 0 22px; font-size: 13px; color: var(--muted); }
  #gate label { display: block; font-size: 12px; color: var(--muted);
                text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
  #gate input { width: 100%; padding: 10px 12px; font-size: 15px; margin-bottom: 14px;
                border: 1px solid var(--line); border-radius: 5px;
                font-family: inherit; color: var(--ink); }
  #gate input:focus { outline: 2px solid var(--slate); outline-offset: -1px; }
  #gate button { width: 100%; padding: 11px; font-size: 15px; font-weight: 600;
                 background: var(--ink); color: #fff; border: 0; border-radius: 5px;
                 cursor: pointer; font-family: inherit; }
  #gate button:disabled { opacity: .55; cursor: default; }
  #gate .err { font-size: 13px; color: #8a2f16; margin: 0 0 12px; display: none; }
  #whoami { float: right; font-size: 12px; color: #aebdc4; }
  #whoami button { background: none; border: 0; color: #aebdc4; cursor: pointer;
                   text-decoration: underline; font-size: 12px; font-family: inherit; padding: 0 0 0 8px; }

  /* Phones. Half the audience opens this on one, so it has to work.
     Fixed-width label + value columns leave a zero-width bar below ~720px,
     so stack the bar underneath its label instead. */
  @media (max-width: 720px) {
    main { padding: 18px 16px 40px; }
    .grid { grid-template-columns: 1fr; gap: 16px; margin-top: 20px; }
    .bar-row { flex-wrap: wrap; gap: 6px 10px; margin-bottom: 12px; }
    .bar-row .name { width: auto; flex: 1 1 auto; font-weight: 600; }
    .bar-row .val { width: auto; flex: 0 0 auto; }
    .bar-row .track { flex: 1 1 100%; order: 3; height: 14px; }
    .bar-row .fill { height: 14px; }
    .dq td { padding: 8px 12px; }
    .dq td.num { width: auto; white-space: nowrap; }
  }
</style>
</head>
<body>
<header>
  <span id="whoami"></span>
  <h1>Broking dashboard</h1>
  <p>Synthetic demonstration data</p>
</header>

<form id="gate" autocomplete="on">
  <h2>Sign in</h2>
  <p class="sub">This dashboard is no longer open to anyone with the link.</p>
  <p class="err" id="gate-err"></p>
  <label for="email">Email</label>
  <input type="email" id="email" name="email" autocomplete="username" required>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required>
  <button type="submit" id="gate-go">Sign in</button>
</form>

<main id="app">
  <div class="status" id="status">Loading…</div>
  <div id="filters"></div>
  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card wide">
      <h2>Revenue by month</h2>
      <div id="chart-month"></div>
    </div>
    <div class="card">
      <h2>Revenue by product line</h2>
      <div id="chart-product"></div>
    </div>
    <div class="card">
      <h2>Revenue by account owner</h2>
      <div id="chart-owner"></div>
    </div>
    <div class="card">
      <h2>Wholesale vs retail</h2>
      <div id="chart-dist"></div>
    </div>
    <div class="card">
      <h2>Top 10 clients</h2>
      <div id="chart-clients"></div>
    </div>
  </div>

  <div class="dq">
    <h2>Data quality — what was changed, and what it moved</h2>
    <div class="dq-scroll"><table id="dq-table"></table></div>
  </div>
</main>

<script>
// ================================================================ cleaning
// Everything below exists because the source extract is not trustworthy.
// Each step is reported in the reconciliation panel at the foot of the page.

// sign goes before the currency symbol, not after it
const gbp  = v => (v < 0 ? "−£" : "£") + Math.abs(Math.round(v)).toLocaleString("en-GB");
const gbp2 = v => (v < 0 ? "−£" : "£") + Math.abs(v).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// money arrives as a number OR as text with thousand separators ("12,450.00").
// parseFloat on the latter silently returns 12, so strip separators first.
const money = v => {
  if (typeof v === "number") return v;
  if (v == null) return 0;
  const n = parseFloat(String(v).replace(/,/g, ""));
  return Number.isFinite(n) ? n : 0;
};
// what a naive read would have produced - kept so we can show the movement
const naiveMoney = v => {
  const n = parseFloat(v);
  return Number.isFinite(n) ? n : 0;
};

// dates arrive as ISO (2024-01-01) or as UK text (23/06/2025).
// new Date("23/06/2025") is Invalid, so parse day-first explicitly.
const parseDate = v => {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(v));
  return m ? new Date(+m[3], +m[2] - 1, +m[1]) : new Date(v);
};

const PRODUCT_MAP = {
  "Kidnap and Ransom": "Kidnap & Ransom",
  "K&R": "Kidnap & Ransom",
  "Prof Indemnity": "Professional Indemnity",
  "PI": "Professional Indemnity",
};
const COUNTRY_MAP = { "USA": "United States", "US": "United States", "UK": "United Kingdom" };
const OWNER_MAP = { "E Voss": "Eleanor Voss" };

const tidy = s => String(s ?? "").replace(/\s+/g, " ").trim();
const titleCase = s => tidy(s).toLowerCase().replace(/\b\w/g, c => c.toUpperCase());

const MIN_YEAR = 2023, MAX_YEAR = 2027;

function clean(raw) {
  const audit = {
    rowsIn: raw.length,
    revenueAsRead: raw.reduce((a, r) => a + naiveMoney(r["Revenue (GBP)"]), 0),
  };

  // 1. parse properly
  const parsed = raw.map(r => {
    const owner = titleCase(r["Account Owner"]);
    return {
      id: r["Policy ID"],
      client: tidy(r["Client"]),
      owner: OWNER_MAP[owner] || owner,
      product: PRODUCT_MAP[tidy(r["Product Line"])] || tidy(r["Product Line"]),
      country: COUNTRY_MAP[tidy(r["Country"])] || tidy(r["Country"]),
      region: tidy(r["Region"]),
      dist: titleCase(r["Distribution"]),
      broker: r["Retail Broker"] ? tidy(r["Retail Broker"]) : null,
      currency: tidy(r["Currency"]).toUpperCase().replace("US$", "USD"),
      date: parseDate(r["Inception Date"]),
      gwp: money(r["GWP (GBP)"]),
      rev: money(r["Revenue (GBP)"]),
    };
  });

  const revenueParsed = parsed.reduce((a, r) => a + r.rev, 0);
  audit.textRecovered = revenueParsed - audit.revenueAsRead;
  // Count rows a naive read would have got WRONG, not rows that happen to be
  // text. Everything arriving from the database is text, so testing the type
  // would flag all of them.
  const misread = v => naiveMoney(v) !== money(v);
  audit.textRows = raw.filter(r => misread(r["Revenue (GBP)"]) || misread(r["GWP (GBP)"])).length;

  // 2. quarantine impossible dates rather than deleting them
  const inWindow = r => {
    const y = r.date.getFullYear();
    return Number.isFinite(y) && y >= MIN_YEAR && y <= MAX_YEAR;
  };
  const quarantined = parsed.filter(r => !inWindow(r));
  const dated = parsed.filter(inWindow);
  audit.quarantinedRows = quarantined.length;
  audit.quarantinedValue = quarantined.reduce((a, r) => a + r.rev, 0);
  audit.quarantinedIds = quarantined.map(r => r.id);

  // 3. de-duplicate on Policy ID, keeping the corrected (higher) row
  const best = new Map();
  for (const r of dated) {
    const prev = best.get(r.id);
    if (!prev || r.rev > prev.rev) best.set(r.id, r);
  }
  const rows = [...best.values()];
  audit.duplicateRows = dated.length - rows.length;
  audit.duplicateValue = dated.reduce((a, r) => a + r.rev, 0) - rows.reduce((a, r) => a + r.rev, 0);

  audit.rowsOut = rows.length;
  audit.revenueAfter = rows.reduce((a, r) => a + r.rev, 0);

  // return premiums are legitimate - reported, never removed
  const returns = rows.filter(r => r.rev < 0);
  audit.returnRows = returns.length;
  audit.returnValue = returns.reduce((a, r) => a + r.rev, 0);

  // fail loudly rather than quietly showing a wrong number
  const expected = audit.revenueAsRead + audit.textRecovered
                 - audit.quarantinedValue - audit.duplicateValue;
  if (Math.abs(expected - audit.revenueAfter) > 0.01) {
    throw new Error(`Reconciliation failed: ${expected} vs ${audit.revenueAfter}`);
  }
  if (rows.some(r => !Number.isFinite(r.rev) || !Number.isFinite(r.gwp))) {
    throw new Error("Non-numeric value survived cleaning");
  }

  return { rows, audit };
}

function render(raw) {
const { rows: DATA, audit: AUDIT } = clean(raw);

// ================================================================ helpers
function sumBy(rows, keyFn, valFn) {
  const out = new Map();
  for (const r of rows) {
    const k = keyFn(r);
    out.set(k, (out.get(k) || 0) + valFn(r));
  }
  return out;
}
const desc = m => [...m.entries()].sort((a, b) => b[1] - a[1]);

function barChart(el, entries, field) {
  const max = Math.max(...entries.map(e => e[1]), 0);
  el.innerHTML = entries.map(([name, val]) => {
    const on = FILTERS[field] === name;
    return `
    <div class="bar-row${field ? " clickable" : ""}${on ? " selected" : ""}"
         ${field ? `data-field="${field}" data-value="${esc(name)}"` : ""}>
      <div class="name">${name}</div>
      <div class="track"><div class="fill" style="width:${max ? (val / max * 100) : 0}%"></div></div>
      <div class="val">${gbp(val)}</div>
    </div>`;
  }).join("");
}

// ================================================================ filtering
// Click any bar to filter everything else by it; click again to clear.
// Each chart is filtered by every OTHER active filter but not its own, so the
// chart you clicked keeps its full range with your choice highlighted.
const FILTERS = {};
const esc = s => String(s).replace(/"/g, "&quot;");

const LABELS = { product: "Product line", owner: "Account owner",
                 dist: "Distribution", client: "Client", month: "Month" };

const matches = (r, key) =>
  Object.entries(FILTERS).every(([k, v]) =>
    k === key || (k === "month" ? monthKey(r.date) === v : r[k] === v));

const viewExcept = key => DATA.filter(r => matches(r, key));
const view = () => DATA.filter(r => matches(r, null));

function toggleFilter(field, value) {
  if (FILTERS[field] === value) delete FILTERS[field];
  else FILTERS[field] = value;
  draw();
}

document.addEventListener("click", ev => {
  const row = ev.target.closest(".bar-row.clickable");
  if (row) { toggleFilter(row.dataset.field, row.dataset.value); return; }
  const chip = ev.target.closest("[data-clear]");
  if (chip) {
    if (chip.dataset.clear === "*") Object.keys(FILTERS).forEach(k => delete FILTERS[k]);
    else delete FILTERS[chip.dataset.clear];
    draw();
  }
});

function drawFilterBar() {
  const el = document.getElementById("filters");
  const keys = Object.keys(FILTERS);
  if (!keys.length) { el.style.display = "none"; return; }
  el.style.display = "flex";
  el.innerHTML =
    `<span class="flabel">Filtered by</span>` +
    keys.map(k => `<button class="chip" data-clear="${k}">${LABELS[k]}: <b>${FILTERS[k]}</b> ×</button>`).join("") +
    `<button class="chip clear" data-clear="*">Clear all</button>`;
}

// the month axis is fixed to the whole dataset so bars don't jump when filtered
const monthKey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
const minD = new Date(Math.min(...DATA.map(r => r.date)));
const maxD = new Date(Math.max(...DATA.map(r => r.date)));
const months = [];
for (let y = minD.getFullYear(), m = minD.getMonth();
     y < maxD.getFullYear() || (y === maxD.getFullYear() && m <= maxD.getMonth()); ) {
  months.push(y + "-" + String(m + 1).padStart(2, "0"));
  m++; if (m > 11) { m = 0; y++; }
}

function drawMonths(rows) {
  const byMonth = sumBy(rows, r => monthKey(r.date), r => r.rev);
  const w = 1300, h = 260, pad = { l: 60, r: 10, t: 10, b: 40 };
  const vals = months.map(k => byMonth.get(k) || 0);
  const max = Math.max(...vals, 1);
  const bw = (w - pad.l - pad.r) / months.length;
  const bars = months.map((k, i) => {
    const bh = (h - pad.t - pad.b) * (vals[i] / max);
    const on = FILTERS.month === k;
    return `<rect class="mbar" data-month="${k}" x="${pad.l + i * bw}" y="${pad.t}"
                  width="${Math.max(bw - 2, 1)}" height="${h - pad.t - pad.b}" fill="transparent"></rect>
            <rect class="mbar" data-month="${k}" x="${pad.l + i * bw}" y="${h - pad.b - bh}"
                  width="${Math.max(bw - 2, 1)}" height="${bh}" fill="${on ? "#e08a3c" : "#3e6b7a"}"></rect>`;
  }).join("");
  const step = Math.ceil(months.length / 14);
  const labels = months.map((k, i) => i % step ? "" :
    `<text x="${pad.l + i * bw + bw / 2}" y="${h - pad.b + 16}" font-size="10" fill="#6b7a82" text-anchor="middle">${k}</text>`).join("");
  document.getElementById("chart-month").innerHTML =
    `<svg viewBox="0 0 ${w} ${h}" style="width:100%;min-width:700px">
       <text x="0" y="14" font-size="10" fill="#6b7a82">${gbp(max)}</text>
       <line x1="${pad.l}" y1="${h - pad.b}" x2="${w - pad.r}" y2="${h - pad.b}" stroke="#dde3e6"></line>
       ${bars}${labels}
     </svg>
     <p style="font-size:12px;color:#6b7a82;margin:8px 0 0">${months.length} months, ${months[0]} to ${months[months.length - 1]} — click a month to filter</p>`;
  document.querySelectorAll("#chart-month .mbar").forEach(el =>
    el.addEventListener("click", () => toggleFilter("month", el.dataset.month)));
}

// ================================================================ draw
function draw() {
  const rows = view();
  const gwp = rows.reduce((a, r) => a + r.gwp, 0);
  const rev = rows.reduce((a, r) => a + r.rev, 0);
  const all = DATA.length;

  document.getElementById("kpis").innerHTML = [
    ["Total GWP", gbp(gwp)],
    ["Total revenue", gbp(rev)],
    ["Policies", rows.length.toLocaleString("en-GB")
      + (rows.length !== all ? ` <span class="of">of ${all.toLocaleString("en-GB")}</span>` : "")],
    ["Average rate", gwp ? (rev / gwp * 100).toFixed(1) + "%" : "—"],
  ].map(([l, v]) => `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div></div>`).join("");

  drawFilterBar();
  drawMonths(FILTERS.month ? rows : viewExcept("month"));
  barChart(document.getElementById("chart-product"), desc(sumBy(viewExcept("product"), r => r.product, r => r.rev)), "product");
  barChart(document.getElementById("chart-owner"),   desc(sumBy(viewExcept("owner"),   r => r.owner,   r => r.rev)), "owner");
  barChart(document.getElementById("chart-dist"),    desc(sumBy(viewExcept("dist"),    r => r.dist,    r => r.rev)), "dist");
  barChart(document.getElementById("chart-clients"), desc(sumBy(viewExcept("client"),  r => r.client,  r => r.rev)).slice(0, 10), "client");
}

draw();

// ================================================================ reconciliation panel
(function drawAudit() {
  const a = AUDIT;
  const row = (label, count, value, cls = "") =>
    `<tr class="${cls}"><td>${label}</td><td class="num">${count ?? ""}</td><td class="num">${value ?? ""}</td></tr>`;

  document.getElementById("dq-table").innerHTML = [
    `<tr><td></td><td class="num" style="color:#6b7a82;font-size:12px">ROWS</td><td class="num" style="color:#6b7a82;font-size:12px">REVENUE</td></tr>`,
    row("As first read from the extract", a.rowsIn.toLocaleString("en-GB"), gbp2(a.revenueAsRead)),
    row("Values stored as text, recovered", `${a.textRows} rows`, `<span class="adj">+ ${gbp2(a.textRecovered)}</span>`),
    row("Duplicate rows removed (corrected row kept)", `− ${a.duplicateRows}`, `<span class="adj">− ${gbp2(a.duplicateValue)}</span>`),
    row(`Held for review — inception date outside ${MIN_YEAR}–${MAX_YEAR}`, `− ${a.quarantinedRows}`, `<span class="adj">− ${gbp2(a.quarantinedValue)}</span>`),
    row("<strong>After cleaning</strong>", `<strong>${a.rowsOut.toLocaleString("en-GB")}</strong>`, `<strong>${gbp2(a.revenueAfter)}</strong>`, "total"),
    `<tr class="note"><td colspan="3">Held for review: ${a.quarantinedIds.join(", ")} — not deleted.
      Includes ${a.returnRows} return premiums totalling ${gbp2(a.returnValue)}, which are legitimate and left in.</td></tr>`,
  ].join("");
})();
}

// ================================================================ load
// Data comes from Supabase via our own server. The browser never sees the
// database key, and never holds a token - the session lives in an httpOnly
// cookie it cannot read.
const gate = document.getElementById("gate");
const appEl = document.getElementById("app");
const status = document.getElementById("status");

function showGate(message) {
  appEl.style.display = "none";
  gate.style.display = "block";
  const err = document.getElementById("gate-err");
  if (message) { err.textContent = message; err.style.display = "block"; }
  else { err.style.display = "none"; }
  document.getElementById("email").focus();
}

function showApp(user) {
  gate.style.display = "none";
  appEl.style.display = "block";
  document.getElementById("whoami").innerHTML = user
    ? `${user.email}<button type="button" id="signout">Sign out</button>` : "";
  const out = document.getElementById("signout");
  if (out) out.onclick = async () => {
    await fetch("/api/logout", { method: "POST" });
    location.reload();
  };
}

async function loadData() {
  try {
    const res = await fetch("/api/policies");
    if (res.status === 401) { showGate(); return; }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || body.error || `HTTP ${res.status}`);
    }
    const rows = await res.json();
    if (!Array.isArray(rows) || rows.length === 0) {
      throw new Error("The policies table returned no rows. Has the data been loaded?");
    }
    status.style.display = "none";
    render(rows);
  } catch (e) {
    status.className = "status error";
    status.textContent = "Could not load the data — " + e.message;
  }
}

gate.addEventListener("submit", async ev => {
  ev.preventDefault();
  const go = document.getElementById("gate-go");
  go.disabled = true; go.textContent = "Signing in…";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { showGate(body.error || `Sign-in failed (${res.status})`); return; }
    showApp(body);
    await loadData();
  } finally {
    go.disabled = false; go.textContent = "Sign in";
  }
});

(async function init() {
  const me = await (await fetch("/api/me")).json().catch(() => ({}));
  if (me.authRequired && !me.user) { showGate(); return; }
  showApp(me.user);
  await loadData();
})();
</script>
