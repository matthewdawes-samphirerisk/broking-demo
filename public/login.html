<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Broking Dashboard</title>
<link rel="stylesheet" href="style.css">
<script>
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<main class="login">
  <form class="login-card" method="post" action="/login">
    <p class="eyebrow">Broking book</p>
    <h1>Sign in</h1>
    <p class="sub">Sign in to view the revenue dashboard.</p>

    <p class="notice" id="notice" role="alert" hidden></p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button class="btn primary" type="submit">Sign in</button>
  </form>
</main>
<script>
  // Messages are fixed text chosen by code, never taken from the URL.
  const MESSAGES = {
    invalid: 'That email and password didn’t work. Check them and try again.',
    rate: 'Too many attempts. Wait a few minutes and try again.',
    config: 'Sign-in isn’t available right now.',
  };
  const q = new URLSearchParams(location.search);
  const n = document.getElementById('notice');
  const msg = MESSAGES[q.get('error')] || (q.has('signed_out') ? 'You’ve been signed out.' : null);
  if (msg) {
    n.textContent = msg;
    n.hidden = false;
    if (q.has('error')) n.classList.add('error');
  }
  // Tidy the address bar so a refresh doesn't repeat the message.
  if (q.toString()) history.replaceState(null, '', '/login');
</script>
</body>
</html>
